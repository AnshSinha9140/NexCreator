name: Weekly Meta Refresh Orchestrator

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  meta-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Meta Refresh Orchestrator
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/meta-refresh.js
